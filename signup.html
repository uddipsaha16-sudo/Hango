<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the Hangout</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Marcellus&display=swap" rel="stylesheet">
<style>
  /* Your fonts: put the files in a "fonts" folder next to this file.
     Until then, similar Google fonts are used automatically. */
  @font-face { font-family:'Perandory';     src:local('Perandory'),     url('fonts/Perandory.otf') format('opentype'); font-display:swap; }
  @font-face { font-family:'Divine Quartz'; src:local('Divine Quartz'), url('fonts/DivineQuartz.otf') format('opentype'); font-display:swap; }
  @font-face { font-family:'Ziron';         src:local('Ziron'),         url('fonts/Ziron.otf') format('opentype'); font-display:swap; }
  @font-face { font-family:'Glamour';       src:local('Glamour'),       url('fonts/Glamour.otf') format('opentype'); font-display:swap; }

  :root {
    --sage:#9cae88; --ivory:#fbf7ea; --cream:#f1e6cc; --cream-dk:#e8dab9;
    --burgundy:#6d1a2b; --olive:#566330; --gold:#b8924a; --gold-lt:#e3cb8c; --gold-dk:#7e5f27;
    --foil:linear-gradient(135deg,#7e5f27 0%,#e6cf8f 38%,#b8924a 58%,#7e5f27 100%);
    --f-head:'Perandory','Cinzel Decorative',serif;
    --f-script:'Divine Quartz','Pinyon Script',cursive;
    --f-label:'Ziron','Marcellus',serif;
    --f-body:'Glamour','Cormorant Garamond',Georgia,serif;
  }
  * { box-sizing:border-box; }
  html { overflow-x:hidden; }
  body {
    margin:0; min-height:100vh; padding:70px 34px 110px; display:flex; justify-content:center; align-items:flex-start;
    overflow-x:hidden; color:var(--olive); font-family:var(--f-body); font-size:1.2rem; font-style:italic;
    background:
      radial-gradient(ellipse at 50% 0%, #c3d0b0 0%, transparent 62%),
      radial-gradient(ellipse at 50% 100%, rgba(109,26,43,.35) 0%, transparent 60%),
      radial-gradient(circle at 1px 1px, rgba(86,99,48,.2) 1px, transparent 1.6px) 0 0/16px 16px,
      linear-gradient(#93a67f,#6f8460);
  }
  .wrap { position:relative; width:100%; max-width:440px; }

  /* the paper card: no frame lines, just soft shadow and a slight tilt */
  .card {
    position:relative; background:var(--ivory); padding:96px 38px 52px; transform:rotate(-.6deg);
    background-image:radial-gradient(circle at 20% 10%, rgba(232,218,185,.55), transparent 45%), radial-gradient(circle at 90% 95%, rgba(232,218,185,.5), transparent 40%);
    box-shadow:0 22px 44px rgba(35,45,20,.4), 0 3px 0 rgba(255,255,255,.7) inset, 8px 8px 0 rgba(109,26,43,.9);
  }
  .card > * { transform:rotate(.6deg); }
  .card > img, .card > .stk { transform:none; }

  /* stickers */
  .stk { position:absolute; z-index:5; pointer-events:none; filter:drop-shadow(2px 4px 3px rgba(40,25,10,.38)); user-select:none; }
  .corner-tl { top:-16px; left:-18px; width:76px; }
  .corner-br { bottom:-16px; right:-18px; width:76px; transform:rotate(180deg); }
  .tagimg    { top:-44px; right:14px; width:78px; transform:rotate(9deg); }
  .starbig   { top:-30px; left:78px; width:46px; transform:rotate(10deg); animation:twinkle 3.6s ease-in-out infinite; }
  .starsm    { top:210px; left:-30px; width:56px; transform:rotate(-12deg); animation:twinkle 4.4s ease-in-out infinite .8s; }
  .ticketimg { bottom:-40px; left:12px; width:152px; transform:rotate(-6deg); }
  .flutter   { top:-36px; left:150px; width:84px; transform:rotate(-12deg); animation:flutter 4s ease-in-out infinite; }

  /* page-specific stickers */
  .deco { display:none; }
  .card[data-step="0"] .d0, .card[data-step="1"] .d1, .card[data-step="2"] .d2 { display:block; }
  .clock    { right:-54px; top:340px; width:84px; transform:rotate(12deg); }
  .key      { left:-46px; top:470px; width:70px; transform:rotate(-34deg); }
  .peony    { left:-54px; top:220px; width:84px; transform:rotate(-12deg); }
  .books    { right:-56px; top:330px; width:90px; transform:rotate(8deg); }
  .bluebird { left:-54px; top:560px; width:84px; transform:rotate(-6deg); }
  .dragonfly{ right:-60px; top:330px; width:96px; transform:rotate(74deg); }
  .postcard { left:-66px; top:600px; width:100px; transform:rotate(-14deg); }
  .roses    { right:-50px; top:690px; width:78px; transform:rotate(10deg); }

  @keyframes twinkle { 0%,100%{ opacity:1; scale:1; } 50%{ opacity:.7; scale:.88; } }
  @keyframes flutter { 0%,100%{ translate:0 0; } 50%{ translate:-4px -8px; } }

  /* headline */
  .hello { font-family:var(--f-script); font-size:2.5rem; color:var(--burgundy); line-height:1; margin:0 0 -4px 4px; font-style:normal; display:inline-block; transform:rotate(-5deg); }
  h1 { margin:0; font-family:var(--f-head); font-weight:700; font-size:3.7rem; line-height:1; letter-spacing:.01em;
    color:var(--gold); background:var(--foil); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(2px 3px 0 rgba(109,26,43,.35)); }
  .sub { margin:8px 0 0; color:var(--olive); font-size:1.25rem; }

  /* step tracker: little pills, no connecting line */
  .stepper { display:flex; gap:8px; margin:20px 0 4px; padding:0; list-style:none; }
  .stepper li { display:flex; align-items:center; gap:6px; padding:4px 12px 4px 5px; border-radius:99px;
    background:var(--cream); color:var(--olive); font-family:var(--f-label); font-size:.72rem; font-style:normal; }
  .stepper .dot { display:grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--cream-dk); color:var(--gold-dk); font-size:.72rem; }
  .stepper li.current { background:var(--burgundy); color:var(--gold-lt); }
  .stepper li.current .dot { background:var(--gold-lt); color:var(--burgundy); }
  .stepper li.done .dot { background:var(--gold); color:var(--ivory); }

  .step { display:none; }
  .step.active { display:block; }
  .page-title { font-family:var(--f-script); font-size:2.2rem; color:var(--burgundy); margin:20px 0 0; font-style:normal; line-height:1.1; }

  /* filled paper-slip fields: no underlines */
  label.t { display:block; margin:16px 0 6px 2px; font-family:var(--f-label); font-size:.8rem; letter-spacing:.05em; color:var(--burgundy); font-style:normal; }
  input[type=text],input[type=email],input[type=password],input[type=number] {
    width:100%; padding:12px 14px; font:inherit; font-size:1.3rem; color:var(--burgundy);
    background:var(--cream); border:0; border-radius:8px; box-shadow:inset 0 2px 5px rgba(126,95,39,.22);
  }
  input::placeholder { color:rgba(86,99,48,.55); }
  input[type=text]:focus,input[type=email]:focus,input[type=password]:focus,input[type=number]:focus {
    outline:3px solid var(--burgundy); outline-offset:1px; background:#fff;
  }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  /* ticket chips */
  .chips { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
  .chips label { position:relative; cursor:pointer; }
  .chips input { position:absolute; opacity:0; inset:0; }
  .chips span {
    display:inline-block; padding:7px 20px; background:var(--cream); color:var(--olive); font-style:normal;
    font-family:var(--f-label); font-size:.8rem; transition:background .15s, color .15s;
    -webkit-mask:radial-gradient(circle at 0 50%,#0000 5px,#000 5.5px) left/51% 100% no-repeat, radial-gradient(circle at 100% 50%,#0000 5px,#000 5.5px) right/51% 100% no-repeat;
            mask:radial-gradient(circle at 0 50%,#0000 5px,#000 5.5px) left/51% 100% no-repeat, radial-gradient(circle at 100% 50%,#0000 5px,#000 5.5px) right/51% 100% no-repeat;
  }
  .chips input:checked + span { background:var(--burgundy); color:var(--gold-lt); }
  .chips input:focus-visible + span { outline:3px solid var(--burgundy); outline-offset:2px; -webkit-mask:none; mask:none; }

  .note { display:flex; gap:10px; align-items:flex-start; margin:16px 0 0; padding:12px 14px; background:var(--cream);
    border-radius:8px; font-size:1.05rem; line-height:1.25; color:var(--olive); }
  .note svg { flex:none; width:22px; height:22px; margin-top:1px; }

  .rules { display:flex; gap:10px; align-items:center; margin-top:20px; }
  .rules input { width:20px; height:20px; accent-color:var(--burgundy); flex:none; }
  .err { color:#a3122f; font-size:1rem; min-height:1.2em; font-style:normal; margin-top:2px; }

  .actions { display:flex; gap:14px; align-items:center; margin-top:20px; }
  button.go {
    flex:1; padding:16px 10px; cursor:pointer; border:0; border-radius:4px;
    font-family:var(--f-label); font-size:1rem; letter-spacing:.08em; font-style:normal;
    color:var(--gold-lt); background:linear-gradient(#85263a,#5a1423);
    box-shadow:0 0 0 3px var(--ivory), 0 0 0 5px var(--gold), 0 8px 0 5px #3c0c16, 0 14px 20px rgba(60,10,25,.35);
  }
  button.go:active { transform:translateY(4px); }
  button.go:focus-visible, button.back:focus-visible { outline:3px solid var(--burgundy); outline-offset:6px; }
  button.back { display:none; padding:12px 8px; background:none; border:0; cursor:pointer; color:var(--burgundy);
    font-family:var(--f-label); font-size:.9rem; }

  #done { display:none; text-align:center; padding:10px 0 20px; font-style:normal; }
  .seal { width:120px; height:120px; margin:0 auto 14px; border-radius:50%; display:grid; place-items:center;
    background:radial-gradient(circle at 35% 30%,#9a2d45,#5a1423 70%); box-shadow:0 5px 12px rgba(60,10,25,.5), inset 0 0 0 6px rgba(227,203,140,.35);
    font-family:var(--f-head); font-size:3rem; color:var(--gold-lt); }
  #done h2 { margin:0; font-family:var(--f-script); font-size:3rem; font-weight:400; color:var(--burgundy); }
  #done p { font-family:var(--f-body); font-style:italic; }

  .alt { margin:18px 0 0; text-align:center; font-size:1.1rem; }
  .alt a { color:var(--burgundy); }
  .ok { color:var(--olive); font-size:1rem; font-style:normal; margin-top:2px; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }
  @media (max-width:380px){ body{ padding-inline:26px; } .card{ padding-inline:30px; } h1{ font-size:3.2rem; } }
</style>
</head>

    <form id="form" novalidate>
      <p class="hello">join the</p>
      <h1>Hangout</h1>
      <p class="sub">make your profile, find your people</p>

      <ol class="stepper" id="stepper" aria-label="Signup progress">
        <li><span class="dot">1</span>account</li>
        <li><span class="dot">2</span>about you</li>
      </ol>

      <!-- PAGE 1 -->
      <section class="step active" data-step="0">
        <p class="page-title">create your account</p>

        <label class="t" for="name">what should we call you?</label>
        <input type="text" id="name" placeholder="your display name" autocomplete="nickname" maxlength="30">
        <div class="err" id="e-name"></div>

        <label class="t" for="email">email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        <div class="err" id="e-email"></div>

        <label class="t" for="pass">secret password</label>
        <input type="password" id="pass" placeholder="8+ characters" autocomplete="new-password">
        <div class="err" id="e-pass"></div>
      </section>

      <!-- PAGE 2 -->
      <section class="step" data-step="1">
        <p class="page-title">tell us about you</p>

        <label class="t" for="age">age</label>
        <input type="number" id="age" min="18" max="99" inputmode="numeric" placeholder="18+">
        <div class="err" id="e-age"></div>

        <label class="t" id="int-label">choose your interests</label>
        <div class="chips" role="group" aria-labelledby="int-label">
          <label><input type="checkbox" name="int" value="Music"><span>Music</span></label>
          <label><input type="checkbox" name="int" value="Gaming"><span>Gaming</span></label>
          <label><input type="checkbox" name="int" value="Movies"><span>Movies</span></label>
          <label><input type="checkbox" name="int" value="Fitness"><span>Fitness</span></label>
          <label><input type="checkbox" name="int" value="Fashion"><span>Fashion</span></label>
          <label><input type="checkbox" name="int" value="Travel"><span>Travel</span></label>
          <label><input type="checkbox" name="int" value="Books"><span>Books</span></label>
          <label><input type="checkbox" name="int" value="Art"><span>Art</span></label>
        </div>
      
        <div class="rules">
          <input type="checkbox" id="rules">
          <label for="rules">I'll be kind and follow the community rules</label>
        </div>
        <div class="err" id="e-rules"></div>
      </section>

      <div class="err" id="e-form" role="alert"></div>

      <div class="actions">
        <button class="back" type="button" id="back">back</button>
        <button class="go" type="submit" id="next">NEXT</button>
      </div>
    <p class="alt">already a member? <a href="login.html">sign in</a></p>
    </form>

    <div id="done" role="status">
      <div class="seal" aria-hidden="true">H</div>
      <h2>you're in</h2>
      <p id="welcome"></p>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// Your Firebase project keys (safe to be public; the security rules protect the data)
const firebaseConfig = {
  apiKey: "AIzaSyCjXbDqW-IWvs4_lZCslpK40hoi16pp-oE",
  authDomain: "hango-70e60.firebaseapp.com",
  projectId: "hango-70e60",
  storageBucket: "hango-70e60.firebasestorage.app",
  messagingSenderId: "668566699498",
  appId: "1:668566699498:web:52d8d9c18c822e5dff8693"
};
const configured = !firebaseConfig.apiKey.startsWith("PASTE");
const app = configured ? initializeApp(firebaseConfig) : null;
const auth = configured ? getAuth(app) : null;
const db = configured ? getFirestore(app) : null;

const $ = id => document.getElementById(id);
const steps = [...document.querySelectorAll('.step')];
const dots = [...document.querySelectorAll('#stepper li')];
let current = 0;

function show(n) {
  current = n;
  $('card').dataset.step = n;
  $('e-form').textContent = '';
  steps.forEach((s, i) => s.classList.toggle('active', i === n));
  dots.forEach((d, i) => {
    d.classList.toggle('current', i === n);
    d.classList.toggle('done', i < n);
    d.querySelector('.dot').textContent = i < n ? '\u2713' : i + 1;
    if (i === n) d.setAttribute('aria-current', 'step'); else d.removeAttribute('aria-current');
  });
  $('back').style.display = n > 0 ? 'block' : 'none';
  $('next').textContent = n === steps.length - 1 ? 'CREATE MY ACCOUNT' : 'NEXT';
  const first = steps[n].querySelector('input');
  if (first) first.focus({ preventScroll: true });
}

const val = id => $(id).value.trim();

function check(n) {
  const e = {};
  if (n === 0) {
    if (val('name').length < 2) e.name = 'Enter a name with at least 2 characters.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('email'))) e.email = 'Enter a valid email address.';
    if ($('pass').value.length < 8) e.pass = 'Use at least 8 characters.';
  }
  if (n === 1) {
    if (!(parseInt($('age').value, 10) >= 18)) e.age = 'You must be 18 or older.';
    if (!$('rules').checked) e.rules = 'Agree to the rules to continue.';
  }
  return e;
}

function showErrors(n, errors) {
  steps[n].querySelectorAll('.err[id]').forEach(el => {
    el.textContent = errors[el.id.slice(2)] || '';
  });
  const firstBad = Object.keys(errors)[0];
  if (firstBad && $(firstBad)) $(firstBad).focus();
}

const authMessages = {
  'auth/email-already-in-use': 'That email already has an account.',
  'auth/invalid-email': 'That email address looks wrong.',
  'auth/weak-password': 'Choose a stronger password (8+ characters).',
  'auth/network-request-failed': 'No internet connection. Try again.',
  'auth/too-many-requests': 'Too many tries. Wait a minute and try again.'
};

$('back').addEventListener('click', () => show(current - 1));

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const errors = check(current);
  showErrors(current, errors);
  if (Object.keys(errors).length) return;

  if (current < steps.length - 1) { show(current + 1); return; }

  if (!configured) {
    $('e-form').textContent = 'Add your Firebase keys in the code first (see the firebaseConfig block).';
    return;
  }

  const name = val('name');
  const age = parseInt($('age').value, 10);
  const interests = [...document.querySelectorAll('input[name=int]:checked')].map(i => i.value);

  const btn = $('next');
  btn.disabled = true; btn.textContent = 'CREATING...';
  $('e-form').textContent = '';
  let accountCreated = false;

  try {
    // Firebase keeps the password safely; it is never stored in the database.
    const cred = await createUserWithEmailAndPassword(auth, val('email'), $('pass').value);
    accountCreated = true;
    await updateProfile(cred.user, { displayName: name });

    const uid = cred.user.uid;
    const batch = writeBatch(db);
    // Public profile: other members can see this
    batch.set(doc(db, 'users', uid), { displayName: name, age, interests, createdAt: serverTimestamp() });
    await batch.commit();

    $('form').style.display = 'none';
    document.querySelectorAll('.deco').forEach(d => d.style.display = 'none');
    $('done').style.display = 'block';
    $('welcome').textContent = 'Welcome, ' + name + '. Your account is ready.';
  } catch (err) {
    console.error(err);
    $('e-form').textContent = accountCreated
      ? 'Your account was created, but saving your profile failed. Please try again.'
      : (authMessages[err.code] || 'Something went wrong. Please try again.');
    btn.disabled = false; btn.textContent = 'CREATE MY ACCOUNT';
  }
});

show(0);
</script>
</body>
</html>
